<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f4f4f4; }
  canvas { background: #fff; border: 2px solid #333; }
  button { margin-top: 10px; padding: 6px 16px; font-size: 16px; }
</style>
</head>
<body>
<h1>Snake</h1>
<p>Score: <span id="score">0</span> <span id="status"></span></p>
<canvas id="board" width="400" height="400"></canvas>
<br>
<button id="restart">Restart</button>
<script>
const SIZE = 20, CELL = 20;
const ctx = document.getElementById('board').getContext('2d');
const scoreEl = document.getElementById('score');
const statusEl = document.getElementById('status');
let snake, dir, nextDir, food, score, timer;

function start() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  score = 0;
  scoreEl.textContent = score;
  statusEl.textContent = '';
  placeFood();
  clearInterval(timer);
  timer = setInterval(step, 120);
  draw();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE ||
      body.some(s => s.x === head.x && s.y === head.y)) {
    clearInterval(timer);
    statusEl.textContent = '- Game Over!';
    return;
  }
  snake.unshift(head);
  if (eating) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, SIZE * CELL, SIZE * CELL);
  ctx.fillStyle = 'red';
  ctx.fillRect(food.x * CELL, food.y * CELL, CELL - 1, CELL - 1);
  ctx.fillStyle = 'green';
  snake.forEach(s => ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 1, CELL - 1));
}

const KEYS = {
  ArrowUp: {x: 0, y: -1}, ArrowDown: {x: 0, y: 1},
  ArrowLeft: {x: -1, y: 0}, ArrowRight: {x: 1, y: 0}
};
document.addEventListener('keydown', e => {
  const d = KEYS[e.key];
  if (!d) return;
  e.preventDefault();
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
});
document.getElementById('restart').addEventListener('click', start);
start();
</script>
</body>
</html>
