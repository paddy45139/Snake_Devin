<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #16224a, #0b1230 70%);
    color: #e6ecff;
  }
  h1 { margin: 0 0 16px; font-size: 40px; letter-spacing: 6px; color: #39ff88; text-shadow: 0 0 12px rgba(57,255,136,.5); }
  .scores { display: flex; gap: 16px; margin-bottom: 14px; }
  .card { background: #131d42; border: 1px solid #24315f; border-radius: 12px; padding: 8px 22px; text-align: center; min-width: 120px; }
  .card span { display: block; font-size: 12px; letter-spacing: 2px; color: #8b97c7; text-transform: uppercase; }
  .card b { font-size: 26px; }
  #message { height: 22px; margin-bottom: 8px; color: #ffd84d; font-weight: 600; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 16px; border: 2px solid #24315f; background: #0f1838; box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 24px rgba(57,255,136,.08); }
  #overlay {
    position: absolute; inset: 0; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8,12,32,.78); text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0 0 8px; font-size: 32px; }
  #overlay p { margin: 4px 0; color: #b8c2ea; }
  .buttons { display: flex; gap: 12px; margin-top: 18px; }
  button {
    font: inherit; font-weight: 600; font-size: 15px; letter-spacing: 1px;
    padding: 10px 22px; border: none; border-radius: 10px; cursor: pointer; color: #0b1230;
    transition: transform .1s, box-shadow .1s, opacity .1s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  button:disabled { opacity: .4; cursor: default; }
  #start { background: #39ff88; }
  #pause { background: #ffd84d; }
  #restart { background: #ff4d79; color: #fff; }
  .hint { margin-top: 12px; font-size: 13px; color: #6f7bab; }
</style>
</head>
<body>
<h1>SNAKE</h1>
<div class="scores">
  <div class="card"><span>Score</span><b id="score">0</b></div>
  <div class="card"><span>High Score</span><b id="high">0</b></div>
</div>
<div id="message"></div>
<div class="wrap">
  <canvas id="board" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlayTitle">Ready?</h2>
    <p id="overlayText">Press Start to play</p>
  </div>
</div>
<div class="buttons">
  <button id="start">Start</button>
  <button id="pause" disabled>Pause</button>
  <button id="restart">Restart</button>
</div>
<div class="hint">Use the arrow keys to move</div>
<script>
const SIZE = 20, CELL = 20, SPEED = 120, HS_KEY = 'snakeHighScore';
const ctx = document.getElementById('board').getContext('2d');
const el = id => document.getElementById(id);
const scoreEl = el('score'), highEl = el('high'), msgEl = el('message');
const overlay = el('overlay'), overlayTitle = el('overlayTitle'), overlayText = el('overlayText');
const startBtn = el('start'), pauseBtn = el('pause');

let snake, dir, nextDir, turnQueued, food, score, prevHigh, state, timer = null;
let highScore = loadHigh();

function loadHigh() {
  try { return parseInt(localStorage.getItem(HS_KEY), 10) || 0; } catch (e) { return 0; }
}
function saveHigh() {
  try { localStorage.setItem(HS_KEY, highScore); } catch (e) {}
}

function stopTimer() { clearInterval(timer); timer = null; }
function startTimer() { stopTimer(); timer = setInterval(step, SPEED); }

function reset() {
  stopTimer();
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  turnQueued = false;
  score = 0;
  prevHigh = highScore;
  placeFood();
  msgEl.textContent = '';
  updateScores();
  draw();
}

function setState(s) {
  state = s;
  startBtn.disabled = s !== 'ready';
  pauseBtn.disabled = s !== 'running' && s !== 'paused';
  pauseBtn.textContent = s === 'paused' ? 'Resume' : 'Pause';
  if (s === 'running') { overlay.classList.add('hidden'); startTimer(); return; }
  stopTimer();
  overlay.classList.remove('hidden');
  if (s === 'ready') { overlayTitle.textContent = 'Ready?'; overlayText.textContent = 'Press Start to play'; }
  if (s === 'paused') { overlayTitle.textContent = 'Paused'; overlayText.textContent = 'Press Resume to continue'; }
  if (s === 'over') {
    overlayTitle.textContent = 'Game Over';
    overlayText.innerHTML = 'Final score: <b>' + score + '</b>' +
      (score > prevHigh ? '<br><span style="color:#ffd84d">New High Score!</span>' : '');
  }
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateScores() {
  scoreEl.textContent = score;
  highEl.textContent = highScore;
}

function step() {
  if (state !== 'running') return;
  dir = nextDir;
  turnQueued = false;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE ||
      body.some(s => s.x === head.x && s.y === head.y)) {
    setState('over');
    return;
  }
  snake.unshift(head);
  if (eating) {
    score += 10;
    if (score > highScore) {
      highScore = score;
      saveHigh();
    }
    if (score > prevHigh) msgEl.textContent = 'New High Score!';
    updateScores();
    if (snake.length < SIZE * SIZE) placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, SIZE * CELL, SIZE * CELL);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 1; i < SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, SIZE * CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(SIZE * CELL, i * CELL + .5); ctx.stroke();
  }
  ctx.shadowColor = '#ff4d79'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff4d79';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 8;
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#b6ffd3' : '#39ff88';
    roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, i === 0 ? 7 : 5);
  });
  ctx.shadowBlur = 0;
  const h = snake[0], cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
  ctx.fillStyle = '#0b1230';
  [-1, 1].forEach(side => {
    ctx.beginPath();
    ctx.arc(cx + dir.x * 4 + dir.y * 4 * side, cy + dir.y * 4 + dir.x * 4 * side, 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

const KEYS = {
  ArrowUp: {x: 0, y: -1}, ArrowDown: {x: 0, y: 1},
  ArrowLeft: {x: -1, y: 0}, ArrowRight: {x: 1, y: 0}
};
document.addEventListener('keydown', e => {
  const d = KEYS[e.key];
  if (!d) return;
  e.preventDefault();
  if (state !== 'running' || turnQueued) return;
  if (d.x === -dir.x && d.y === -dir.y) return;
  if (d.x === dir.x && d.y === dir.y) return;
  nextDir = d;
  turnQueued = true;
});
startBtn.addEventListener('click', () => { if (state === 'ready') setState('running'); });
pauseBtn.addEventListener('click', () => {
  if (state === 'running') setState('paused');
  else if (state === 'paused') setState('running');
});
el('restart').addEventListener('click', () => { reset(); setState('running'); });

reset();
setState('ready');
</script>
</body>
</html>
